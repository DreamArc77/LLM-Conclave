services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      REDIS_DISABLED: 'true'
      # Chromium is pre-installed in the Docker image — no need to change this
      CHROMIUM_PATH: '/usr/bin/chromium-browser'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
